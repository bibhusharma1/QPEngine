name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Run parser, reconstruction, and scraper tests
        run: uv run pytest tests/Parser tests/Reconstruct tests/Scrapper -v
