services:
  masterdeorca:
    build:
      context: .
      args:
        INSTALL_OCR_GPU: ${INSTALL_OCR_GPU:-false}
    container_name: PaperWise
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      DATABASE_BACKEND: sqlite
      STORAGE_BACKEND: sqlite
      QUES_STORAGE_ROOT: /data
      DATABASE_PATH: /data/masterdeorca.sqlite
      QUES_PORT: 8000
    ports:
      - "${QUES_PORT:-8000}:8000"
    volumes:
      - "${QUES_STORAGE_ROOT:-${HOME}/.local/share/masterdeorca}:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
